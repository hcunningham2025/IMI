backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "library"
    label: "IMI Content"
    files:
      - name: "libraryjson"
        label: "All Content"
        file: "content/library.json"
        format: "json"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            summary: "{{fields.type}} — {{fields.title}}"
            fields:
              - { label: "Type", name: "type", widget: "select", options: ["videos","images","articles","documentaries","investigations","podcasts"] }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "URL", name: "url", widget: "string", required: false }
              - { label: "Embed URL", name: "embed", widget: "string", required: false }
              - { label: "Thumbnail", name: "thumbnail", widget: "image", required: false }

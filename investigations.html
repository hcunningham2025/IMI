<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Investigations</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body data-type="investigations">
<h1>Investigations</h1>
<div id="contentMount"></div>

<script>
(async function(){
  const type = document.body.dataset.type;
  const mount = document.getElementById("contentMount");
  const res = await fetch("content/library.json",{cache:"no-store"});
  const data = await res.json();
  const items = (data.items||[]).filter(i=>i.type===type);

  mount.innerHTML = items.map(i=>`
    <div style="border:1px solid #ccc;padding:15px;margin:10px 0">
      <h3>${i.title||""}</h3>
      <p>${i.description||""}</p>
      ${i.embed?`<iframe src="${i.embed}" style="width:100%;aspect-ratio:16/9;border:0" allowfullscreen></iframe>`:""}
      ${i.url?`<p><a href="${i.url}" target="_blank">Open Link</a></p>`:""}
      ${i.thumbnail?`<img src="${i.thumbnail}" style="max-width:300px"/>`:""}
    </div>
  `).join("");
})();
</script>

</body>
</html>

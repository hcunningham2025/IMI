
<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Manage Content</title><link rel="stylesheet" href="/admin/dashboard.css"/>
</head><body>
<div class="wrap">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">IMI</div>
      <div><div style="font-weight:900">IMI Admin</div><div class="small">Content Manager</div></div>
    </div>
    <div class="nav">
      <a href="/admin/">Dashboard</a>
      <a href="/admin/manage-content/">Manage Content</a>
      <hr style="border:0;border-top:1px solid rgba(200,163,95,.18);margin:14px 0">
      <a href="#" id="logout">Logout</a>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <a class="btn" href="/" target="_blank" rel="noopener">View Site</a>
      <a class="btn btnPrimary" href="/admin/manage-content/">Manage Content</a>
    </div>
    <h1 class="h1">Content Manager</h1>

    <div style="margin-top:30px">
      <form id="uploadForm">
        <div style="margin-bottom:15px">
          <label for="imageFile" style="font-weight:600;color:#fff">Upload Image</label>
          <input type="file" id="imageFile" name="image" style="display:block;margin-top:10px"/>
        </div>

        <div style="margin-bottom:15px">
          <label for="videoUrl" style="font-weight:600;color:#fff">Video URL</label>
          <input type="url" id="videoUrl" name="video" style="display:block;margin-top:10px"/>
        </div>

        <div style="margin-bottom:15px">
          <label for="articleContent" style="font-weight:600;color:#fff">Article Content</label>
          <textarea id="articleContent" name="article" rows="6" style="width:100%;display:block;margin-top:10px"></textarea>
        </div>

        <button type="submit" class="btn btnPrimary">Submit Content</button>
      </form>
    </div>
  </main>
</div>

<script>
// Handle admin login and content upload
function requireAuth(){
  const u = netlifyIdentity.currentUser();
  if(!u){ window.location.replace('/admin/login.html'); }
}
netlifyIdentity.on('init', requireAuth);
netlifyIdentity.init();

document.getElementById('logout').addEventListener('click', function(e){
  e.preventDefault();
  netlifyIdentity.logout();
  window.location.replace('/admin/login.html');
});

// Handle form submission for new content (articles, videos, etc)
document.getElementById("uploadForm").addEventListener("submit", function(e){
  e.preventDefault();
  const image = document.getElementById("imageFile").files[0];
  const videoUrl = document.getElementById("videoUrl").value;
  const articleContent = document.getElementById("articleContent").value;

  // Handle image upload, URL saving, and article content submission
  if (image){
    // Upload image logic
    console.log("Image uploaded:", image.name);
  }
  if (videoUrl){
    console.log("Video URL submitted:", videoUrl);
  }
  if (articleContent){
    console.log("Article content submitted:", articleContent);
  }
});
</script>
</body></html>
